#name: rag-assistant

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:?set ES_VERSION in .env}
    container_name: rag-es
    environment:
      - discovery.type=single-node          # one node, no cluster discovery
      - xpack.security.enabled=false        # DEV ONLY, see section 3.6
      - ES_JAVA_OPTS=-Xms1g -Xmx1g          # JVM heap: keep it at about half the container memory
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 2g                           # leave room for the JVM and Lucene outside the heap
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  kibana:                                   # optional web UI, started only with the "tools" profile
    image: docker.elastic.co/kibana/kibana:${ES_VERSION:?set ES_VERSION in .env}
    container_name: rag-kibana
    profiles: ["tools"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:

